authors = ["Jim Lin lin.jim3478@gmail.com"]
description = "A small calculator made using Rust"
license = "MIT"
repository = "https://github.com/Jim-2330/rs_calc"

[dependencies]
clap = { version = "4", features = ["derive"] }
